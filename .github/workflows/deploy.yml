name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a new push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # These end up compiled into the static bundle, as they must for a
          # backend-less SPA. They are not secrets in the traditional sense —
          # VITE_GOOGLE_CLIENT_ID is a public OAuth client identifier, and the
          # real access boundary is Google's test-user allow-list plus this
          # app's own email check at sign-in, not the secrecy of these values.
          # See README.md "Security notes" for the full reasoning.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SHEET_ID: ${{ secrets.VITE_GOOGLE_SHEET_ID }}
          VITE_ALLOWED_GOOGLE_EMAIL: ${{ secrets.VITE_ALLOWED_GOOGLE_EMAIL }}
          VITE_APP_USERNAME: ${{ secrets.VITE_APP_USERNAME }}
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Only runs if `build` succeeded — lint, test, or build failures stop here.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
