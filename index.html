<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#315b8c" />
    <meta
      name="description"
      content="SpendFlow — a personal salary and expense planner backed by your own Google Sheet."
    />

    <!-- iOS: Safari ignores the Web Manifest for Home Screen behavior, so
         these legacy meta tags are what actually make "Add to Home Screen"
         open in standalone (no browser chrome) mode with the right title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpendFlow" />

    <title>SpendFlow — Personal Salary &amp; Expense Planner</title>
  </head>
  <body>
    <!-- Static fallback shown only in the brief window (typically well
         under a second) before React mounts — see main.tsx, which may wait
         for the service worker before rendering. Inline styles so this
         doesn't depend on the stylesheet having loaded yet. -->
    <div
      id="root"
      style="
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #64748b;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
      "
    >
      SpendFlow
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
